<!-- ترتيب التحميل مهم: الوحدات تتشارك نفس النطاق العام. لا تغيّر الترتيب. -->
<script>/* تشخيص: يعرض أي خطأ تحميل/تشغيل على الشاشة بدل الصفحة البيضاء */
(function(){var box;function show(m){if(!box){box=document.createElement('pre');box.id='bootErr';box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;margin:0;padding:12px 16px;background:#7f1d1d;color:#fff;font:12px/1.6 monospace;z-index:99999;direction:ltr;text-align:left;white-space:pre-wrap';(document.body||document.documentElement).appendChild(box)}box.textContent+=m+'\n'}
addEventListener('error',function(e){if(e.target&&e.target!==window&&(e.target.src||e.target.href))show('LOAD FAILED: '+(e.target.src||e.target.href));else show('JS ERROR: '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')')},true);
addEventListener('unhandledrejection',function(e){show('PROMISE: '+(e.reason&&(e.reason.stack||e.reason.message)||e.reason))})})();</script>

<script async src="templates.js"></script>
